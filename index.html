  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./favicon.png">

  <script src="./parent-view.js" defer></script><script src="./parent-public.js" defer></script><script src="./home.js" defer></script><link rel="stylesheet" href="./parent-public.css">

<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden"><symbol id="arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m7-7-7 7 7 7"/></symbol><symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-3-3-7-3-9-2v15c3-1 6 0 9 2 3-2 6-3 9-2V4c-2-1-6-1-9 2Z"/><path d="M12 6v15"/></symbol><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></symbol><symbol id="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></symbol><symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol><symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke-linejoin="round"/></symbol><symbol id="report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20V8" stroke-width="4"/></symbol><symbol id="retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 6"/></symbol><symbol id="sprout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9C5 13 2 9 3 4c5-1 9 2 9 8 0-6 4-9 9-8 1 5-2 9-9 8"/></symbol><symbol id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9Z"/></symbol><symbol id="volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol></svg>
  <div class="learning-home">
    <header class="home-header">
      <button class="profile" type="button" data-action="profile" aria-label="查看小小奥特曼资料（演示）">
        <span class="avatar artwork" data-art="avatar-ultraman" aria-hidden="true"></span>
        <span class="profile-copy"><span class="profile-name">小小奥特曼</span><span class="greeting"><svg class="icon" aria-hidden="true"><use href="#sprout"></use></svg>每天进步一点点</span></span>
      </button>
      <nav class="home-nav" aria-label="功能入口">
        <a href="./content-center.html" id="open-content-center"><span class="bubble"><svg class="icon" aria-hidden="true"><use href="#book"></use></svg></span>内容中心</a>
        <a href="./parent-courses.html" data-parent-gate><span class="bubble"><svg class="icon" aria-hidden="true"><use href="#report"></use></svg></span>定制</a>
      </nav>
    </header>
    <p class="orientation-hint">横过来，一起探索学习岛。分屏时也可以继续浏览。</p>
    <main>
      <section class="home-section today" aria-labelledby="today-title">
        <div class="section-head"><h1 id="today-title">今日任务</h1><p id="today-progress" aria-live="polite">正在准备任务…</p><span class="demo-tag">演示课程</span></div>
        <div class="rail-wrap"><div class="rail" id="today-rail" tabindex="0" aria-label="今日任务，左右滑动查看更多" aria-busy="true"><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></div></div>
      </section>
      <section class="home-section weekly" aria-labelledby="week-title">
        <div class="section-head"><h2 id="week-title">本周任务</h2><p>英语体验版 S1 · 第1周</p></div>
        <div class="rail-wrap"><div class="rail" id="week-rail" tabindex="0" aria-label="本周任务，左右滑动查看更多" aria-busy="true"><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></div></div>
      </section>
      <p id="learning-error" class="home-message" role="alert" hidden>加载失败，再试一次。<button id="retry-home" type="button">重新加载</button></p>
      <p id="demo-storage" class="home-message" role="status" hidden>演示进度无法保存，关闭页面后可能丢失。原有视频记录不受此演示功能影响。</p>
      <noscript><p class="home-message">请启用 JavaScript 查看任务。<a href="./report.html">前往定制与视频导入</a></p></noscript>
    </main>
    <footer class="home-footer">
      <p>左右滑动，发现更多学习内容</p>
      <p class="demo-note">课程与点评为演示内容 · 「定制」可导入并播放真实视频</p>
      <div class="home-meta"><span id="pwa-status" role="status">正在准备离线首页…</span><button type="button" data-action="install">添加到主屏幕</button><span>v4.2.0</span></div>
    </footer>
    <div class="update-notice" id="pwa-update" role="status" hidden><span>新版本已准备好</span><button id="pwa-apply" type="button">更新并重新加载</button></div>
    <dialog class="home-dialog" id="home-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" type="button" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#close"></use></svg></button></div>
      <p class="dialog-label" id="dialog-label">演示</p><p id="dialog-body"></p><div class="dialog-actions" id="dialog-actions"></div>
    </dialog>
  </div>
</body>
</html>
