<!doctype html>
<html lang="zh-CN" class="learning-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#12AD65" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小小学习岛" />
    <title>小小学习岛</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.png" />
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="./content-center.css" />
    <link rel="stylesheet" href="./parent.css" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./app-button.css" />
    <link rel="stylesheet" href="./history.css" />
    <link rel="stylesheet" href="./interaction.css" />
    <script src="./interaction.js" defer></script>
    <script src="./app-core.js" defer></script>
    <script src="./app-store.js" defer></script>
    <script src="./app-media.js" defer></script>
    <script src="./app-player.js" defer></script>
    <script src="./hls-core.js" defer></script>
    <script src="./app-views.js" defer></script>
    <script src="./app-history.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./pwa.js" defer></script>
  </head>
  <body>
    <div id="app-view">
      <p class="boot-message" role="status">正在打开学习岛…</p>
    </div>
    <section id="watch-view" class="watch-view" hidden aria-label="视频播放器">
      <div class="watch-stage" id="watch-stage">
        <div id="watch-empty" hidden>
          <svg class="icon" aria-hidden="true">
            <use href="./assets/parent/icons/sprite.svg#swap"></use>
          </svg>
          <h2>需要重新关联视频</h2>
          <p>请家长选择原视频，课程和学习记录都还在。</p>
          <button
            id="watch-relink-missing"
            class="app-button app-button--primary"
            data-relink=""
          >
            重新关联本机视频
          </button>
        </div>
        <video id="video" playsinline preload="metadata"></video>
        <button
          id="watch-shield"
          class="watch-shield"
          hidden
          aria-label="播放器已锁定"
        ></button>
      </div>
      <details id="watch-menu" class="watch-menu">
        <summary id="watch-menu-toggle" aria-label="家长操作" title="家长操作">
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="./assets/parent/icons/sprite.svg#more"></use>
          </svg>
        </summary>
        <div class="watch-panel">
          <header class="watch-head">
            <p class="watch-eyebrow">家长操作</p>
            <h1 id="watch-title"></h1>
            <p id="watch-status" role="status"></p>
          </header>
          <nav class="watch-tools" aria-label="播放选项">
            <button
              id="watch-back"
              class="app-button app-button--secondary"
              aria-label="返回课程"
            >
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="./assets/parent/icons/sprite.svg#back"></use>
              </svg>
              <span id="watch-back-label">返回课程</span>
            </button>
            <button
              id="watch-lock"
              class="app-button app-button--secondary"
              aria-pressed="true"
            >
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="./assets/parent/icons/sprite.svg#lock"></use>
              </svg>
              <span id="watch-lock-label">解锁操作</span>
            </button>
            <button
              id="watch-fullscreen"
              class="app-button app-button--secondary"
            >
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="./assets/parent/icons/sprite.svg#fullscreen"></use>
              </svg>
              <span>进入全屏</span>
            </button>
          </nav>
          <div id="watch-actions" class="watch-actions"></div>
        </div>
      </details>
      <p id="watch-notice" class="watch-notice" role="status" hidden></p>
    </section>
    <div class="parent-view" id="modal-host">
      <dialog id="dialog" aria-labelledby="modal-title"></dialog>
    </div>
    <input
      id="pick-import"
      type="file"
      accept="video/*,.mp4,.mov,.m4v,.webm"
      multiple
      hidden
    /><input
      id="pick-playlist"
      type="file"
      accept=".m3u8,application/vnd.apple.mpegurl"
      multiple
      hidden
    />
    <input
      id="pick-relink"
      type="file"
      accept="video/*,.mp4,.mov,.m4v,.webm"
      multiple
      hidden
    /><input
      id="pick-backup"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="update-notice" id="pwa-update" role="status" hidden>
      <span>新版本已准备好</span
      ><button
        id="pwa-apply"
        type="button"
        class="app-button app-button--primary"
      >
        更新并重新加载
      </button>
    </div>
    <noscript><p>请启用 JavaScript 使用学习岛。</p></noscript>
  </body>
</html>
