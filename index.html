<!doctype html>
<html lang="zh-CN" class="learning-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#12AD65" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小小学习岛" />
    <title>小小学习岛</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.png" />
    <link rel="stylesheet" href="./home.css" />
    <link rel="stylesheet" href="./content-center.css" />
    <link rel="stylesheet" href="./parent.css" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./app-button.css" />
    <link rel="stylesheet" href="./history.css" />
    <link rel="stylesheet" href="./interaction.css" />
    <script src="./interaction.js" defer></script>
    <script src="./app-core.js" defer></script>
    <script src="./app-store.js" defer></script>
    <script src="./app-media.js" defer></script>
    <script src="./app-player.js" defer></script>
    <script src="./hls-core.js" defer></script>
    <script src="./app-views.js" defer></script>
    <script src="./app-history.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./pwa.js" defer></script>
  </head>
  <body>
    <div id="app-view">
      <p class="boot-message" role="status">正在打开学习岛…</p>
    </div>
    <section id="watch-view" class="watch-view" hidden aria-label="视频播放器">
      <header class="watch-head">
        <button id="watch-back" class="app-back" aria-label="返回课程">
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="./assets/parent/icons/sprite.svg#back"></use>
          </svg>
        </button>
        <div>
          <h1 id="watch-title"></h1>
          <p id="watch-status" role="status"></p>
        </div>
        <button id="watch-lock" class="app-button app-button--secondary">
          锁定操作</button
        ><button id="watch-fullscreen" class="app-button app-button--secondary">
          全屏播放
        </button>
      </header>
      <div class="watch-stage" id="watch-stage">
        <p id="watch-empty" hidden>
          本机视频需要重新关联，课程与学习记录已保留。
        </p>
        <video id="video" playsinline controls preload="metadata"></video
        ><button
          id="watch-shield"
          class="watch-shield"
          hidden
          aria-label="播放器已锁定"
        ></button>
      </div>
      <div id="watch-actions" class="watch-actions"></div>
    </section>
    <div class="parent-view" id="modal-host">
      <dialog id="dialog" aria-labelledby="modal-title"></dialog>
    </div>
    <input
      id="pick-import"
      type="file"
      accept="video/*,.mp4,.mov,.m4v,.webm"
      multiple
      hidden
    /><input
      id="pick-playlist"
      type="file"
      accept=".m3u8,application/vnd.apple.mpegurl"
      multiple
      hidden
    />
    <input
      id="pick-relink"
      type="file"
      accept="video/*,.mp4,.mov,.m4v,.webm"
      multiple
      hidden
    /><input
      id="pick-backup"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="update-notice" id="pwa-update" role="status" hidden>
      <span>新版本已准备好</span
      ><button
        id="pwa-apply"
        type="button"
        class="app-button app-button--primary"
      >
        更新并重新加载
      </button>
    </div>
    <noscript><p>请启用 JavaScript 使用学习岛。</p></noscript>
  </body>
</html>
