<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>学习首页视口检查</title><style>body{margin:0;font:14px system-ui;background:#eee;color:#123}header{padding:10px;background:white;position:sticky;top:0;z-index:2}button{padding:10px;margin:3px}iframe{display:block;border:0;margin:12px 0}pre{white-space:pre-wrap;margin:8px;max-height:100px;overflow:auto;font-size:11px}h1{font-size:16px;margin:0}</style><header><h1>真实 CSS 视口检查（不缩放页面）</h1><nav id="sizes"></nav><button id="measure">读取布局指标</button><pre id="result">等待首页加载</pre></header><iframe id="preview" title="学习首页预览" src="../index.html" width="1024" height="768"></iframe><script>
const frame=document.querySelector('#preview'),out=document.querySelector('#result');
const sizes=[[1024,768],[1180,820],[1194,834],[1366,1024],[768,1024],[507,820]];
let selected=sizes[0];
function measure(){const d=frame.contentDocument;if(!d)return;const rails=[...d.querySelectorAll('.rail')];out.textContent=JSON.stringify({viewport:selected,pageWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,noPageOverflow:d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,rails:rails.map(r=>({id:r.id,width:r.clientWidth,scrollWidth:r.scrollWidth,left:r.scrollLeft,hasMore:r.parentElement.classList.contains('has-more')})),nav:[...d.querySelectorAll('.home-nav a,.home-nav button')].map(el=>({label:el.textContent.trim(),width:Math.round(el.getBoundingClientRect().width)})),imageFailures:d.querySelectorAll('.asset-fallback').length},null,1)}
for(const size of sizes){const b=document.createElement('button');b.textContent=size.join(' × ');b.onclick=()=>{selected=size;frame.width=size[0];frame.height=size[1];requestAnimationFrame(()=>requestAnimationFrame(measure))};document.querySelector('#sizes').append(b)}
document.querySelector('#measure').onclick=measure;frame.onload=()=>{measure();const ro=new ResizeObserver(measure);ro.observe(frame.contentDocument.body)};
</script></html>
