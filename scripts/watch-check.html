<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全屏播放与长按保护验收</title><style>body{margin:0;background:#eee;font:14px system-ui}header{position:sticky;top:0;background:#fff;padding:12px;z-index:2}button{min-height:44px;margin:4px;padding:8px 16px}pre{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:12px}iframe{border:0;display:block;margin-top:12px}</style><header><strong>全屏播放验收（真实 CSS 视口，不缩放）</strong><br><button id="layouts">检查五种视口</button><button id="routes">检查首页与内容中心直达</button><button id="interactions">检查长按保护与输入例外</button><button id="lockcheck">检查锁定与解锁</button><pre id="result">准备就绪</pre></header><iframe id="preview" title="全屏播放器预览" src="../report.html#watch=1&placeholder=1&from=home&title=学习视频" width="1024" height="768"></iframe><script>
const frame=document.querySelector('#preview'),out=document.querySelector('#result'),pause=ms=>new Promise(r=>setTimeout(r,ms));
const open=async src=>{frame.src=src;await pause(450)};
const metrics=()=>{const d=frame.contentDocument,w=frame.contentWindow,video=d.querySelector('#video'),box=video.getBoundingClientRect(),lock=d.querySelector('#watch-lock').getBoundingClientRect();return{viewport:[w.innerWidth,w.innerHeight],page:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],fullscreenPage:d.documentElement.classList.contains('watch-mode'),noHorizontalOverflow:d.documentElement.scrollWidth<=w.innerWidth,noVerticalOverflow:d.documentElement.scrollHeight<=w.innerHeight+1,video:{width:Math.round(box.width),height:Math.round(box.height)},videoFillsViewport:Math.abs(box.width-w.innerWidth)<1&&Math.abs(box.height-w.innerHeight)<1,lockCentered:Math.abs(lock.y+lock.height/2-w.innerHeight/2)<1,chromeHidden:['.player-footer','.player-heading','.columns','.header'].every(s=>w.getComputedStyle(d.querySelector(s)).display==='none'),openDialogs:d.querySelectorAll('dialog[open]').length,source:video.src?new URL(video.src).hostname:null}};
document.querySelector('#layouts').onclick=async()=>{const rows=[];for(const [w,h] of [[1024,768],[1180,820],[1366,1024],[768,1024],[507,820]]){frame.width=w;frame.height=h;await pause(100);rows.push(metrics())}out.textContent=JSON.stringify(rows,null,1)};
document.querySelector('#routes').onclick=async()=>{const rows=[];for(const selector of ['[data-action="feedback"]','[data-action="weekend"]','[data-lesson="fruits"]']){await open('../index.html');frame.contentDocument.querySelector(selector).click();await pause(450);rows.push({entry:selector,...metrics()});frame.contentWindow.history.back();await pause(350);rows[rows.length-1].returnedHome=!!frame.contentDocument.querySelector('.learning-home')}
await open('../content-center.html');frame.contentDocument.querySelector('[data-course="english"]').click();await pause(450);rows.push({entry:'content english',...metrics()});frame.contentWindow.history.back();await pause(350);rows[rows.length-1].returnedContent=!!frame.contentDocument.querySelector('#course-grid');out.textContent=JSON.stringify(rows,null,1)};
document.querySelector('#interactions').onclick=async()=>{const rows=[];for(const page of ['index.html','content-center.html','report.html']){await open('../'+page);const d=frame.contentDocument,w=frame.contentWindow,heading=d.querySelector('h1'),img=d.querySelector('img'),input=d.querySelector('textarea');const e=new w.Event('contextmenu',{bubbles:true,cancelable:true});heading.dispatchEvent(e);const copy=new w.Event('copy',{bubbles:true,cancelable:true});heading.dispatchEvent(copy);const row={page,displaySelection:w.getComputedStyle(heading).webkitUserSelect||w.getComputedStyle(heading).userSelect,contextMenuBlocked:e.defaultPrevented,copyBlocked:copy.defaultPrevented,imageHitTesting:img?w.getComputedStyle(img).pointerEvents:null};if(input){const edit=new w.Event('contextmenu',{bubbles:true,cancelable:true});input.dispatchEvent(edit);row.inputSelection=w.getComputedStyle(input).webkitUserSelect||w.getComputedStyle(input).userSelect;row.inputMenuAllowed=!edit.defaultPrevented}rows.push(row)}out.textContent=JSON.stringify(rows,null,1)};
document.querySelector('#lockcheck').onclick=async()=>{
await open('../report.html#watch=1&placeholder=1');const d=frame.contentDocument,w=frame.contentWindow,video=d.querySelector('#video'),lock=d.querySelector('#watch-lock'),shield=d.querySelector('#watch-shield');
const rows=[{state:'unlocked',controls:video.controls,autoplay:video.autoplay,shieldHidden:shield.hidden}];lock.click();
const key=new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true});video.dispatchEvent(key);
const tap=new w.MouseEvent('click',{bubbles:true,cancelable:true});shield.dispatchEvent(tap);
rows.push({state:'locked',controls:video.controls,shieldHidden:shield.hidden,pressed:lock.getAttribute('aria-pressed'),seekKeyBlocked:key.defaultPrevented,tapBlocked:tap.defaultPrevented});
lock.click();rows.push({state:'unlocked again',controls:video.controls,shieldHidden:shield.hidden,pressed:lock.getAttribute('aria-pressed')});out.textContent=JSON.stringify(rows,null,1);
};</script></html>
