<!doctype html>
<html lang="zh-CN" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12AD65">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小小学习岛">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>内容中心 · 小小学习岛</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./content-center.css">
  <script src="./profile.js" defer></script>
  <script src="./player-core.js" defer></script>
  <script src="./content-config.js" defer></script>
  <script src="./reward-core.js" defer></script>
  <script src="./reward-store.js" defer></script>
  <script src="./content-demo.js" defer></script>
  <script src="./content-center.js" defer></script>
  <script src="./pwa.js" defer></script>
</head>
<body>
  <div class="content-center">
    <header class="center-header">
      <div class="center-heading">
        <a class="back-button" id="center-back" href="./index.html" aria-label="返回学习首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
        <div><h1>内容中心</h1><p>看视频，点亮你的英雄</p></div>
      </div>
      <div class="center-profile" id="center-profile"></div>
    </header>
    <p class="reward-rule"><img src="./assets/icons/energy-star.svg" alt="" width="28" height="28"><span id="reward-rule">看完1个视频 → 点亮1枚能量徽章 · 集齐5枚 → 合成英雄</span></p>
    <div class="demo-banner" id="demo-banner" hidden><strong>视觉演示 · 不记录学习奖励</strong><span>以下为设计示例状态，学习按钮仅演示合成。</span><a href="./content-center.html">返回我的内容中心</a></div>
    <main>
      <div id="content-status" class="center-message" role="status">正在读取本机学习记录…</div>
      <section class="course-grid" id="course-grid" aria-label="我的课程" aria-busy="true"></section>
      <p class="center-message" id="content-error" role="alert" hidden><span id="error-detail"></span><button id="retry-content" type="button">重新加载</button></p>
      <div id="reward-feedback" class="reward-feedback" role="status" aria-live="polite" hidden></div>
      <noscript><p>请启用 JavaScript 读取本机学习记录。<a href="./index.html">返回首页</a></p></noscript>
    </main>
    <footer class="center-footer">
      <p>课程由你关联导入的视频；尚未接入课程后台。完成奖励保存在此设备，视频仍需联网。</p>
      <p>英雄素材：复用已有奥特曼头像插画；第二、第三位独立徽章待补齐，获得记录会保留。</p>
      <div><a href="./content-center.html#demo">查看视觉演示</a><span id="pwa-status" role="status">正在准备离线页面…</span><span>v4.1.0</span></div>
    </footer>
    <div class="center-update" id="pwa-update" role="status" hidden><span>新版本已准备好</span><button id="pwa-apply" type="button">更新并重新加载</button></div>
    <dialog id="course-dialog" aria-labelledby="course-dialog-title" aria-describedby="course-dialog-note">
      <div class="dialog-heading"><h2 id="course-dialog-title"></h2><button id="close-course" type="button" aria-label="关闭课程选择">×</button></div>
      <p id="course-dialog-note">选择要学习的视频。关联与打开不会增加徽章，首次有效播放完成才计入。</p>
      <div id="course-video-list"></div>
      <p id="course-dialog-error" role="alert" hidden></p>
      <a id="course-import" class="learn-button" href="./report.html">导入新视频</a>
    </dialog>
  </div>
</body>
</html>
